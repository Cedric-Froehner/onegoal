<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="https://www.og1o.com/_assets/625e2d6cb54141905b51c20d13baa45b/Icons/favicon.svg">
<link rel="apple-touch-icon" href="https://www.og1o.com/_assets/625e2d6cb54141905b51c20d13baa45b/Icons/favicon.svg">
<title>Torstand</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;display:flex;flex-direction:column;font-family:Arial,sans-serif;user-select:none;overflow:hidden;background:#1a1a2e;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#sb{display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;background:#1a1a2e;color:white;font-size:.85rem}
#timer{font-size:1.1rem;font-weight:bold;letter-spacing:2px}
#tt{background:rgba(255,255,255,.2);border:none;color:white;border-radius:12px;padding:4px 10px;font-size:.8rem;cursor:pointer}
#ga{display:flex;flex:1}
.team{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.team:active{filter:brightness(.85)}
#t1{background:#434098;color:white}
#t2{background:#e74c3c;color:white}
.tn{font-size:1.4rem;font-weight:bold;margin-bottom:8px;opacity:.85}
.sc{font-size:22vw;font-weight:bold;line-height:1}
.hi{font-size:.75rem;margin-top:6px;margin-bottom:10px;opacity:.6}
.logo{width:130px;max-height:60px;object-fit:contain;margin-bottom:12px;pointer-events:none}
.rows{display:flex;flex-direction:column;gap:5px;align-items:center}
.pr{display:flex;gap:4px}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(0,0,0,.2)}
.dot.scored{background:rgba(0,0,0,.7)}
#t1 .dot{background:rgba(255,255,255,.3)}
#t1 .dot.scored{background:rgba(255,255,255,.95)}
.fxb{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));background:rgba(0,0,0,.5);color:white;border:none;border-radius:20px;padding:8px 14px;font-size:.9rem;cursor:pointer;z-index:10}
#stg{left:calc(16px + env(safe-area-inset-left))}
#rst{left:50%;transform:translateX(-50%)}
#lgt{right:calc(16px + env(safe-area-inset-right))}
#undo{position:fixed;top:calc(12px + env(safe-area-inset-top));right:calc(16px + env(safe-area-inset-right));background:rgba(0,0,0,.5);color:white;border:none;border-radius:20px;padding:5px 12px;font-size:.8rem;cursor:pointer;z-index:110;display:none}
#lgp{display:none;position:fixed;bottom:calc(55px + env(safe-area-inset-bottom));right:calc(16px + env(safe-area-inset-right));width:220px;max-height:280px;overflow-y:auto;background:rgba(20,20,40,.95);color:white;border-radius:12px;padding:12px;font-size:.8rem;z-index:20}
#lgp h3{margin-bottom:8px;font-size:.9rem;border-bottom:1px solid rgba(255,255,255,.2);padding-bottom:4px}
.le{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.t1g{color:#a89dff}.t2g{color:#ff8a80}
.ov{display:none;position:fixed;inset:0;color:white;flex-direction:column;align-items:center;justify-content:center;z-index:100;text-align:center;gap:8px;padding:20px;overflow-y:auto}
.ov.show{display:flex}
#wo{background:rgba(0,0,0,.85)}
#ro{background:rgba(0,0,0,.75)}
#so{background:rgba(0,0,0,.92)}
.ov h1{font-size:2.5rem}.ov h2{font-size:1.8rem}.ov p{font-size:1rem;opacity:.8}
.ov button{margin-top:6px;padding:10px 24px;border:none;border-radius:24px;background:white;color:#1a1a2e;font-size:1rem;font-weight:bold;cursor:pointer}
.obtn{background:rgba(255,255,255,.2)!important;color:white!important}
.ov label{font-size:.85rem;opacity:.8;display:block;margin-top:10px;margin-bottom:3px}
.ov input[type=text]{width:200px;padding:8px 12px;border-radius:12px;border:none;font-size:.9rem;text-align:center}
.crow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.cbtn{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.cbtn.sel{border-color:white}
.tbtn{background:rgba(255,255,255,.15);border:2px solid transparent;color:white;border-radius:10px;padding:5px 9px;font-size:.8rem;cursor:pointer;margin:2px}
.tbtn.sel{border-color:white;background:rgba(255,255,255,.3)}
#curl{width:210px;padding:6px 10px;border-radius:10px;border:none;font-size:.8rem;text-align:center;margin-top:4px}
#cw{display:none}
</style>
</head>
<body>
<div id="sb">
  <button id="tt" onclick="toggleTimer()">▶ Start</button>
  <div style="text-align:center"><div id="timer">00:00</div><div id="ri">Paarung 1 von 3</div></div>
  <div style="width:60px"></div>
</div>
<button id="undo" onclick="undoGoal()">↩️ Rückgängig</button>
<div id="ga">
  <div class="team" id="t1" onclick="addGoal(1)">
    <img class="logo" id="l1" src="https://www.og1o.com/_assets/625e2d6cb54141905b51c20d13baa45b/Images/oneo-logo.svg" alt="one.O">
    <div class="sc" id="s1">0</div>
    <div class="hi">Tippen zum Zählen</div>
    <div class="rows" id="d1"></div>
  </div>
  <div class="team" id="t2" onclick="addGoal(2)">
    <div class="tn" id="t2n">Team 2</div>
    <div class="sc" id="s2">0</div>
    <div class="hi">Tippen zum Zählen</div>
    <div class="rows" id="d2"></div>
  </div>
</div>
<button class="fxb" id="stg" onclick="openSettings()">⚙️ Teams</button>
<button class="fxb" id="rst" onclick="resetScores()">🔄 Neu starten</button>
<button class="fxb" id="lgt" onclick="toggleLog()">📋 Tore</button>
<div id="lgp"><h3>⚽ Tor-Protokoll</h3><div id="lge"></div></div>
<div id="ro" class="ov"><h2 id="rt"></h2><p id="rs"></p><p id="rsc"></p><button onclick="dismissRound()">Weiter spielen ▶</button></div>
<div id="wo" class="ov"><h1 id="wt"></h1><p id="ws"></p><p id="wti"></p><button onclick="resetScores()">🔄 Neues Spiel</button><button class="obtn" onclick="dismissWinner()">📋 Protokoll ansehen</button></div>
<div id="so" class="ov">
  <h2>⚙️ Teams einstellen</h2>
  <label>🏠 Heimteam</label><div id="t1p"></div>
  <div id="cw"><label>Logo-URL</label><input type="text" id="curl" placeholder="https://..."><label>Oder Datei</label><input type="file" id="cfile" accept="image/*" style="color:white;font-size:.8rem;margin-top:4px"></div>
  <label>Farbe Heimteam</label><div class="crow" id="c1"></div>
  <label>Gastteam Name</label><input type="text" id="ni" placeholder="Team 2" maxlength="20">
  <label>Farbe Gastteam</label><div class="crow" id="c2"></div>
  <button onclick="saveSettings()" style="margin-top:12px">💾 Speichern</button>
  <button class="obtn" onclick="$('so').classList.remove('show')">Abbrechen</button>
</div>
<script>
const TMS=[{n:'one.O',l:'https://www.og1o.com/_assets/625e2d6cb54141905b51c20d13baa45b/Images/oneo-logo.svg',b:'#434098'},{n:'Hermes',l:'https://www.myhermes.at/typo3conf/ext/generalfunctions/Resources/Public/img/logo.svg',b:'#ffffff'},{n:'Risk.Ident',l:'https://riskident.com/wp-content/uploads/2020/03/RiskIdent_Logo_2020-2.svg',b:'#fafafa'},{n:'OTTO',l:'https://upload.wikimedia.org/wikipedia/commons/a/ad/Otto_GmbH_logo.svg',b:'#ffffff'},{n:'Eigenes',l:'',b:'#333333'}];
const CL=['#434098','#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#e91e63','#009900','#e2001a','#ffffff','#fafafa','#607d8b','#333333'];
let sc=[0,0],round=1,nm=7,log=[],secs=0,running=false,iv=null,over=false;
let t1i=0,t1bg=TMS[0].b,t1lo=TMS[0].l,t1n=TMS[0].n,t2n='Team 2',t2c='#e74c3c';
let _i=0,_c1=TMS[0].b,_c2='#e74c3c';
const $=id=>document.getElementById(id);
const ovs=['ro','wo','so'];
const gn=t=>t===1?t1n:t2n;
const fmt=n=>String(n).padStart(2,'0');
const getTime=()=>fmt(Math.floor(secs/60))+':'+fmt(secs%60);
function textColor(hex){const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return(r*299+g*587+b*114)/1000>128?'#1a1a2e':'#ffffff';}
function dotColor(hex){return(()=>{const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return(r*299+g*587+b*114)/1000>128;})();}
function applyTeamColors(){const tc1=textColor(t1bg),tc2=textColor(t2c);$('t1').style.background=t1bg;$('t1').style.color=tc1;$('t2').style.background=t2c;$('t2').style.color=tc2;}
function mkPicker(id,cur,cb){const r=$(id);r.innerHTML='';CL.forEach(c=>{const b=document.createElement('div');b.className='cbtn'+(c===cur?' sel':'');b.style.background=c;b.style.border='3px solid '+(c===cur?'white':'transparent');b.onclick=()=>{cb(c);mkPicker(id,c,cb);};r.appendChild(b);});const cp=document.createElement('input');cp.type='color';cp.value=cur;cp.style.cssText='width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0';cp.oninput=e=>{cb(e.target.value);r.querySelectorAll('.cbtn').forEach(b=>b.classList.remove('sel'));};r.appendChild(cp);}
function mkT1Pick(){const r=$('t1p');r.innerHTML='';TMS.forEach((t,i)=>{const b=document.createElement('button');b.className='tbtn'+(_i===i?' sel':'');b.textContent=t.n;b.onclick=()=>{_i=i;_c1=TMS[i].b;mkT1Pick();mkPicker('c1',_c1,c=>_c1=c);$('cw').style.display=i===4?'block':'none';};r.appendChild(b);});}
function openSettings(){_i=t1i;_c1=t1bg;_c2=t2c;$('ni').value=t2n;$('curl').value='';mkT1Pick();mkPicker('c1',_c1,c=>_c1=c);mkPicker('c2',_c2,c=>_c2=c);$('cw').style.display=_i===4?'block':'none';$('so').classList.add('show');}
function saveSettings(){const apply=lo=>{t1i=_i;t1bg=_c1;t1lo=lo;t1n=TMS[_i].n;t2n=$('ni').value.trim()||'Team 2';t2c=_c2;applyTeamColors();$('t2n').textContent=t2n;const l=$('l1');l.src=t1lo;l.alt=t1n;l.style.display=t1lo?'block':'none';updDots();$('so').classList.remove('show');};if(_i===4){const f=$('cfile').files[0];if(f){const fr=new FileReader();fr.onload=e=>apply(e.target.result);fr.readAsDataURL(f);}else apply($('curl').value.trim()||t1lo);}else apply(TMS[_i].l);}
function startTimer(){if(!running){iv=setInterval(()=>{secs++;$('timer').textContent=getTime();},1000);running=true;$('tt').textContent='⏸ Pause';}}
function toggleTimer(){if(running){clearInterval(iv);running=false;$('tt').textContent='▶ Start';}else startTimer();}
function updDots(){[1,2].forEach(t=>{const el=$('d'+t);const bg=t===1?t1bg:t2c;const dark=dotColor(bg);el.innerHTML='';[[1,7],[8,14],[15,21]].forEach(([a,b])=>{const row=document.createElement('div');row.className='pr';for(let i=a;i<=b;i++){const d=document.createElement('div');d.className='dot';d.style.background=i<=sc[t-1]?(dark?'rgba(0,0,0,.75)':'rgba(255,255,255,.95)'):(dark?'rgba(0,0,0,.2)':'rgba(255,255,255,.3)');row.appendChild(d);}el.appendChild(row);});});}
function updLog(){const c=$('lge');c.innerHTML='';log.slice().reverse().forEach(e=>{const d=document.createElement('div');d.className='le '+(e.t===1?'t1g':'t2g');d.innerHTML='<span>⚽ '+gn(e.t)+'</span><span>'+e.s1+':'+e.s2+'</span><span>'+e.time+'</span>';c.appendChild(d);});}
function updUndo(){$('undo').style.display=log.length?'block':'none';}
function addGoal(t){if(over||ovs.some(id=>$(id).classList.contains('show')))return;startTimer();sc[t-1]++;log.push({t,s1:sc[0],s2:sc[1],time:getTime(),round,nm});$('s'+t).textContent=sc[t-1];updDots();updLog();updUndo();if(sc[t-1]>=21){showWinner(t);return;}if(sc[t-1]===nm&&round<3){round++;nm=nm===7?14:21;showRound(t,sc[t-1]);}}
function undoGoal(){if(!log.length)return;over=false;const l=log.pop();sc[l.t-1]--;round=l.round;nm=l.nm;$('s'+l.t).textContent=sc[l.t-1];$('ri').textContent='Paarung '+round+' von 3';ovs.forEach(id=>$(id).classList.remove('show'));updDots();updLog();updUndo();}
function showRound(t,ms){$('rt').textContent='🔄 Paarungswechsel!';$('rs').textContent=gn(t)+' hat '+ms+' Tore – Paarung '+round+' beginnt!';$('rsc').textContent='Stand: '+sc[0]+':'+sc[1];$('ri').textContent='Paarung '+round+' von 3';$('ro').classList.add('show');}
function dismissRound(){$('ro').classList.remove('show');}
function showWinner(t){if(running)toggleTimer();over=true;$('wt').textContent='🏆 '+gn(t)+' gewinnt!';$('ws').textContent='Endstand: '+sc[0]+':'+sc[1];$('wti').textContent='⏱ '+getTime();$('wo').classList.add('show');}
function dismissWinner(){$('wo').classList.remove('show');$('lgp').style.display='block';updLog();}
function toggleLog(){const p=$('lgp');p.style.display=p.style.display==='block'?'none':'block';}
function resetScores(){if(confirm('Neu starten?')){sc=[0,0];round=1;nm=7;log=[];secs=0;running=false;over=false;clearInterval(iv);$('s1').textContent='0';$('s2').textContent='0';$('tt').textContent='▶ Start';$('ri').textContent='Paarung 1 von 3';$('timer').textContent='00:00';ovs.forEach(id=>$(id).classList.remove('show'));$('lgp').style.display='none';updDots();updLog();updUndo();}}
applyTeamColors();updDots();
</script>
</body>
</html>
